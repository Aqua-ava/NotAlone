<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>来源续证：交互原型</title><style>body{font:16px system-ui;max-width:760px;margin:48px auto;padding:0 20px;color:#223}section{background:#f4f6f8;border-radius:12px;padding:18px;margin:16px 0}button{padding:9px 14px;margin:5px;border:1px solid #adb8c5;border-radius:7px;background:white;cursor:pointer}strong{color:#245a99}small{color:#555}</style><h1>来源续证：交互原型</h1><p>问题：应用关闭后，文件事件回放能否证明来源连续？这里模拟判断规则，不连接微信或读取任何资料。</p><section><strong>当前状态</strong><p id="state"></p><small id="note"></small></section><section><h2>自由操作</h2><div id="actions"></div></section><section><h2>引导场景</h2><div id="tabs"></div><p id="guide"></p><button id="step">执行下一步</button></section><script>
// 可迁移的纯状态转换；本原型不代表 OS 或微信行为已经认证。
const initial=()=>({phase:'关闭',journal:'未知',change:'未知',decision:'停读',note:'必须先建立有来源的观察基线。'});
function transition(s,a){let n={...s};if(a==='baseline')return {phase:'运行',journal:'已建立',change:'未见变化',decision:'按支持档决定',note:'仅表示观察期间已建立基线。'};if(a==='close')return {...n,phase:'关闭',decision:'停读',note:'应用退出后不读取。'};if(a==='reopen')return {...n,phase:'续证中',change:'未知',decision:'停读',note:'先回放日志，不能凭相同文件摘要直接放行。'};if(a==='history')return {...n,journal:'历史回放结束',decision:'停读',note:'历史回放结束不等于随后不会收到已发生的事件。'};if(a==='write')return {...n,change:'有文件写入',decision:'停读',note:'普通写入和文件内部来源重建需要进一步区分。'};if(a==='replace')return {...n,change:'文件被替换',decision:'停读',note:'已知替换不能自动恢复旧来源。'};if(a==='loss')return {...n,journal:'事件丢失或日志不可用',decision:'停读',note:'缺失事件不能当作没有变化。'};return initial();}
const labels={baseline:'建立观察基线',close:'退出应用',reopen:'重新打开并续证',history:'历史回放结束',write:'收到文件写入事件',replace:'收到文件替换事件',loss:'事件丢失或日志不可用',reset:'重置'};
const scenarios=[{name:'正常重开',description:'历史回放结束后仍需证明续证完整。',steps:['baseline','close','reopen','history']},{name:'离线替换',description:'应用关闭时发生替换，续证必须停读。',steps:['baseline','close','reopen','replace']},{name:'迟到事件',description:'历史回放结束后仍可能收到此前发生的写入。',steps:['baseline','close','reopen','history','write']},{name:'证据丢失',description:'不能把缺失日志解释为没有变化。',steps:['baseline','close','reopen','loss']}];
let state=initial(),scenario=0,index=0;const out=document.querySelector('#state'),note=document.querySelector('#note'),guide=document.querySelector('#guide');
function render(){out.textContent=`应用：${state.phase}；事件记录：${state.journal}；来源变化：${state.change}；读取决定：${state.decision}`;note.textContent=state.note;guide.textContent=`${scenarios[scenario].description} 下一步：${index<scenarios[scenario].steps.length?labels[scenarios[scenario].steps[index]]:'已结束'}`;}
for(const [key,label] of Object.entries(labels)){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{state=transition(state,key);render()};document.querySelector('#actions').append(b)}
scenarios.forEach((v,i)=>{let b=document.createElement('button');b.textContent=v.name;b.onclick=()=>{scenario=i;index=0;state=initial();render()};document.querySelector('#tabs').append(b)});
document.querySelector('#step').onclick=()=>{let action=scenarios[scenario].steps[index];if(action){state=transition(state,action);index++}render()};render();
</script></html>
