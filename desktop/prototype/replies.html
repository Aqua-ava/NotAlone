<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NotAlone · 候选回复排版预览</title>
<!-- 一次性排版原型：A 三行、B 三列、C 重点一条；合成文字，所有编辑仅留在内存。 -->
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#293e4c;background:#f1f4f6;font-size:14px;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}body{margin:0}button,textarea{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,summary:focus-visible{outline:2px solid #467b9e;outline-offset:3px}
.toolbar{max-width:1048px;margin:36px auto 24px;padding:0 24px;display:flex;align-items:center;justify-content:space-between;gap:20px}.eyebrow{font-size:11px;letter-spacing:2px;color:#738590}.toolbar h1{font-size:24px;margin:9px 0 8px;font-weight:600;letter-spacing:-.6px}.toolbar p{font-size:13px;color:#7b8992;margin:0}
.sizes{display:flex;gap:4px;background:#e7ecef;padding:4px;border-radius:8px}.sizes button{border:0;background:transparent;border-radius:5px;padding:7px 10px;font-size:12px;white-space:nowrap}.sizes button.active{background:white;box-shadow:0 1px 4px #243c4810}
.window{width:calc(100% - 48px);max-width:900px;margin:0 auto 110px;background:#f8fafb;border:1px solid #dce4e8;border-radius:14px;box-shadow:0 18px 60px #203a4910;overflow:hidden;transition:max-width .2s}
.window.narrow{max-width:560px}.windowbar{display:flex;align-items:center;gap:8px;padding:14px 20px;background:white;border-bottom:1px solid #e8edef;font-size:12px}.dots{display:flex;gap:5px;margin-right:14px}.dots i{width:8px;height:8px;border-radius:50%;background:#dbe2e6}.brand{font-weight:600;color:#567086}.demo{margin-left:auto;color:#8c989e;font-size:11px}
.workspace{padding:24px}.context{display:flex;align-items:center;gap:9px;margin-bottom:18px;font-size:12px;color:#7b8c97}.avatar{width:26px;height:26px;background:#e4edf2;border-radius:50%;display:grid;place-items:center;color:#51768d}.context strong{color:#455f70;font-weight:500}.context .dot{width:4px;height:4px;border-radius:50%;background:#b1bfc8}
.input-preview{border-left:2px solid #d9e5eb;padding:0 0 0 12px;margin-bottom:22px}.input-preview small{font-size:11px;color:#86949d}.input-preview p{margin:6px 0 0;font-size:13px;color:#59707f;line-height:1.6}
.candidates{border:1px solid #d9e3e9;border-radius:12px;background:white;overflow:hidden}
.heading{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:18px 20px 12px}.heading h2{font-size:16px;margin:0;font-weight:600}.count{font-size:11px;color:#84939c;font-weight:400;margin-left:8px}.hint{font-size:11px;color:#97a2a9;white-space:nowrap}
.rows{padding:0 20px}.reply{position:relative;padding:17px 0}.reply+.reply{border-top:1px solid #e7edf0}.reply-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;gap:10px}.label{display:flex;align-items:center;gap:8px;font-size:11px;color:#83949f}.num{font-variant-numeric:tabular-nums;color:#a1b0b9;font-size:10px}.copy{background:white;border:1px solid #dbe5ea;border-radius:5px;font-size:12px;line-height:1;padding:5px;white-space:nowrap;color:#446f8a;width:28px;height:28px;display:inline-grid;place-items:center;flex-shrink:0}.copy:hover{background:#eef5f9;border-color:#b7ccda}
textarea{display:block;width:100%;background:transparent;border:1px solid transparent;border-radius:5px;resize:none;overflow:hidden;line-height:1.7;font-size:15px;margin:0;padding:3px 5px 3px 0;min-height:36px;outline:none}textarea:hover{background:#f7fafb}textarea:focus{border-color:#b2cddc;background:#f7fafb;padding-left:5px}
.row-bottom{display:flex;align-items:flex-start;gap:12px;margin-top:5px}.basis{font-size:11px;color:#8595a0;flex:1}.basis summary{cursor:pointer;list-style:none;display:inline-block}.basis summary::after{content:"⌄";margin-left:5px}.basis[open] summary::after{content:"⌃"}.basis p{font-size:12px;line-height:1.7;color:#697e8c;margin:9px 0 0;padding:10px;background:#f5f8fa;border-radius:6px}.risk{font-size:10px;color:#a47e43;line-height:1.6}
.foot{border-top:1px solid #e9eef1;padding:11px 20px;background:#fcfdfe;font-size:11px;color:#8a99a3}.foot summary{cursor:pointer;list-style:none;display:flex;justify-content:space-between}.foot p{line-height:1.8;margin-bottom:2px}
.A .reply{display:grid;grid-template-columns:66px minmax(0,1fr) 28px;align-items:center;column-gap:14px;padding:13px 0}.A .reply-top{display:contents}.A .label{grid-column:1;grid-row:1;white-space:nowrap}.A textarea{grid-column:2;grid-row:1;min-width:0}.A .copy{grid-column:3;grid-row:1}.A .foot .row-bottom{padding:10px 0;border-top:1px solid #e7edf0}.A .foot .row-bottom::before{content:attr(data-label);font-size:11px;color:#708592;white-space:nowrap}.A .foot .row-bottom:first-child{margin-top:12px}.A .foot .risk{max-width:none}
.B .rows{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));padding:8px 0 18px}.B .reply{padding:0 18px;display:flex;flex-direction:column}.B .reply+.reply{border-top:0;border-left:1px solid #e5ecef}.B textarea{min-height:110px}.B .row-bottom{margin-top:auto;padding-top:12px;display:block}.B .risk{display:block;margin-top:7px}.B .reply-top{margin-bottom:14px}
.C .rows{padding:0 14px 8px;display:grid;grid-template-columns:1fr 1fr;gap:0 16px}.C .reply:first-child{grid-column:1/-1;background:#f1f7fa;padding:16px;border:1px solid #e2edf3;border-radius:8px;margin:4px 0 5px}.C .reply:first-child textarea{font-size:17px}.C .reply:not(:first-child){padding:14px 6px;border-top:0}.C .reply:nth-child(3){border-left:1px solid #edf1f4;padding-left:18px}.C .row-bottom{display:block}.C .risk{display:block;margin-top:5px}
.after{display:flex;align-items:center;justify-content:space-between;margin-top:18px;color:#98a4ab;font-size:11px}.after span:last-child{color:#6f8796}
.caption{max-width:760px;margin:22px auto 0;text-align:center;font-size:12px;line-height:1.8;color:#778b98}.caption strong{color:#4e6d81;font-weight:500}
.switcher{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:4px;border-radius:12px;padding:6px;background:#263d4c;box-shadow:0 8px 28px #182b4530;z-index:5;white-space:nowrap}.switcher button{border:0;background:transparent;color:#b7c8d3;border-radius:7px;padding:10px 16px;font-size:12px}.switcher button.active{background:#fff;color:#294d65}.switcher .arrow{padding:10px;color:#d5e0e7}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
@media(max-width:650px){.toolbar{margin-top:22px;align-items:flex-start}.toolbar h1{font-size:20px}.toolbar p{max-width:250px;line-height:1.6}.workspace{padding:16px}.window{width:calc(100% - 24px)}.sizes{display:none}.heading{padding:16px 16px 10px}.rows{padding:0 16px}.B .reply{padding:0 10px}.B textarea{font-size:13px;min-height:140px}.B .label{gap:3px;font-size:10px}.B .copy{padding:5px}.hint{display:none}.switcher button{padding:10px}.caption{padding:0 8px}.risk{max-width:160px}}
</style>
<header class="toolbar">
  <div><div class="eyebrow">NOTALONE / DESIGN PREVIEW</div><h1>三个回复，一眼看完。</h1><p>同一组示例内容，比较三种排版；点击正文可修改。</p></div>
  <div class="sizes" aria-label="预览宽度"><button class="active" data-size="wide">宽窗口</button><button data-size="narrow">窄窗口</button></div>
</header>
<main class="window" id="window">
  <div class="windowbar"><span class="dots"><i></i><i></i><i></i></span><span class="brand">NotAlone</span><span class="demo">排版原型 · 示例内容</span></div>
  <div class="workspace">
    <div class="context"><span class="avatar">友</span><strong>示例联系人</strong><span class="dot"></span><span>帮我表达</span></div>
    <div class="input-preview"><small>我的想法</small><p>谢谢对方的推荐，这周末有空就去看看。</p></div>
    <section class="candidates" id="candidates" aria-label="候选回复">
      <header class="heading"><h2>候选回复<span class="count">3 种说法</span></h2><span class="hint">正文可直接编辑</span></header>
      <div class="rows" id="rows"></div>
      <details class="foot"><summary><span>生成说明</span><span id="generation-hint">输入与依据 ⌄</span></summary><p>本页仅使用合成示例。三个版本表达同一方向，依据均来自上方示例想法。编辑留在当前页面，复制取编辑后的文字。</p><div id="explanations"></div></details>
    </section>
    <div class="after"><span>选择喜欢的说法，修改后复制</span><span>由你亲自发送</span></div>
    <div class="caption" id="caption"></div>
  </div>
</main>
<nav class="switcher" aria-label="切换排版方案">
  <button class="arrow" id="prev" aria-label="上一个方案">←</button>
  <button data-variant="A">A · 横向长条</button><button data-variant="B">B · 三列并排</button><button data-variant="C">C · 重点一条</button>
  <button class="arrow" id="next" aria-label="下一个方案">→</button>
</nav>
<div class="sr" role="status" id="status"></div>
<script>
const copyIcon='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v11a1 1 0 0 0 1 1h4"/></svg>';
const copiedIcon='<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 4 4L19 6"/></svg>';
const samples=[
  {name:'自然',text:'这家看起来不错，谢谢推荐！周末有空我去看看。',basis:'保留感谢和周末有空再去的意思，语气平实，没有增加新的安排。'},
  {name:'简短',text:'收到，谢谢推荐，周末有空去看看～',basis:'省去评价，直接回应推荐；保留“有空”这个前提。'},
  {name:'热情',text:'看着就很想去！谢谢你推荐，周末有空我去逛逛，回来跟你分享。',basis:'表达更多期待，并加了一句后续分享。新增内容需要你自行判断是否保留。',risk:'新增「回来跟你分享」'}
];
const captions={A:'<strong>A · 横向长条</strong>　编号与风格在左，正文居中，复制在右。三条共用一个框，依据收在底部。',B:'<strong>B · 三列并排</strong>　三个说法平行对照。宽窗口更清楚，窄窗口会有更多换行。',C:'<strong>C · 重点一条</strong>　第一条完整铺开，另两条放下面。阅读重点更明确。'};
let current=new URLSearchParams(location.search).get('variant')||'A';
if(!['A','B','C'].includes(current))current='A';
const rows=document.getElementById('rows');
samples.forEach((sample,index)=>{
  const article=document.createElement('article');article.className='reply';
  article.innerHTML=`<div class="reply-top"><span class="label"><span class="num">0${index+1}</span>${sample.name}</span><button class="copy" aria-label="复制第${index+1}条回复" title="复制">${copyIcon}</button></div><textarea rows="1" aria-label="第${index+1}条回复" spellcheck="false"></textarea><div class="row-bottom"><details class="basis"><summary>依据</summary><p>${sample.basis}</p></details>${sample.risk?`<span class="risk">${sample.risk}</span>`:''}</div>`;
  article.querySelector(".row-bottom").dataset.label=`0${index+1} ${sample.name}`;
  const editor=article.querySelector('textarea');editor.value=sample.text;
  editor.addEventListener('input',()=>{sample.text=editor.value;fit(editor)});
  article.querySelector('.copy').addEventListener('click',async(event)=>{
    const button=event.currentTarget;
    try{await navigator.clipboard.writeText(editor.value);button.innerHTML=copiedIcon;button.title='已复制';document.getElementById('status').textContent=`已复制第${index+1}条回复`;setTimeout(()=>{button.innerHTML=copyIcon;button.title='复制'},1200)}
    catch{button.title='请选中文字手动复制';editor.focus();editor.select();document.getElementById('status').textContent='请选中文字手动复制'}
  });
  rows.append(article);
});
function fit(editor){editor.style.height='auto';editor.style.height=editor.scrollHeight+'px'}
function resize(){document.querySelectorAll('textarea').forEach(fit)}
const explanations=Array.from(document.querySelectorAll('.row-bottom'));
const articles=Array.from(rows.children);
function show(variant){
  current=variant;const url=new URL(location.href);url.searchParams.set('variant',variant);history.replaceState(null,'',url);
  document.getElementById('candidates').className='candidates '+variant;
  explanations.forEach((item,index)=>(variant==='A'?document.getElementById('explanations'):articles[index]).append(item));
  document.getElementById('generation-hint').textContent=variant==='A'?'1 项新增表达提醒 · 依据 ⌄':'输入与依据 ⌄';
  document.querySelectorAll('[data-variant]').forEach(button=>{button.classList.toggle('active',button.dataset.variant===variant);button.setAttribute('aria-pressed',String(button.dataset.variant===variant))});
  document.getElementById('caption').innerHTML=captions[variant];resize();
}
function step(delta){show(['A','B','C'][(['A','B','C'].indexOf(current)+delta+3)%3])}
document.querySelectorAll('[data-variant]').forEach(button=>button.onclick=()=>show(button.dataset.variant));
document.getElementById('prev').onclick=()=>step(-1);document.getElementById('next').onclick=()=>step(1);
document.addEventListener('keydown',event=>{if(event.target.closest('input,textarea,[contenteditable]'))return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();step(event.key==='ArrowLeft'?-1:1)}});
document.querySelectorAll('[data-size]').forEach(button=>button.onclick=()=>{document.getElementById('window').classList.toggle('narrow',button.dataset.size==='narrow');document.querySelectorAll('[data-size]').forEach(item=>item.classList.toggle('active',item===button))});
new ResizeObserver(resize).observe(rows);show(current);
</script>
</html>
