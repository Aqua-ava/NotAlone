[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notalone"
version = "0.1.0"
description = "面向具体联系人的关系感知回复助手"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "deepagents==0.7.6",
    "langchain==1.3.15",
    "langchain-core==1.5.5",
    "langgraph==1.2.11",
    "psycopg[binary]>=3.3.4,<4",
]

[project.scripts]
notalone-ingest-preview = "notalone.ingest.preview:main"
notalone-ingest = "notalone.ingest.import_command:main"

[tool.setuptools.packages.find]
where = ["src"]
