name: 最小 CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  privacy:
    name: 公开历史隐私检查
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      # CI 无本机 .env 和私有策略；本机 pre-push 仍是上传前的检查入口。
      - run: node scripts/check_public_history.mjs --ref HEAD --working-tree
      - name: 上传前隐私拦截回归
        run: node --test scripts/tests/pre-push.test.mjs

  backend:
    name: 后端纯单元测试
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      # 白名单仅依赖标准库和合成夹具；不安装模型依赖、不连接数据库。
      - name: 导入边界与已确认联系人匹配
        env:
          PYTHONPATH: src
        run: >-
          python -S -m unittest
          tests.unit.ingest.test_models
          tests.unit.ingest.test_jsonl_reader
          tests.unit.ingest.test_validator
          tests.unit.ingest.test_normalizer
          tests.unit.conversation.test_matcher
          tests.unit.experiments.test_problem_budget
          -v

  desktop:
    name: 桌面类型与合成安全测试
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: 安装锁定依赖，不下载 Electron
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci
      - run: npm run typecheck
      # 只运行可跨平台的合成测试，不启动 App、微信或原生探针。
      - name: 权限、诊断隐私与候选复制边界
        run: >-
          node --test
          tests/screen-permission.test.mjs
          tests/helpers/calibration-progress.test.mjs
          tests/candidate-copy/controller.test.mjs
