name: 代码检查

# 只做静态与登记门禁：不启动桌面 App、不打包、不连接数据库、不发送任何外部消息。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: 桌面类型与测试登记
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --filter ./desktop install --frozen-lockfile
      - run: pnpm --dir desktop run typecheck
      - run: node desktop/scripts/test-inventory.mjs

  backend:
    name: TypeScript 后端检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm --filter ./backend-ts install --frozen-lockfile
      - run: pnpm --dir backend-ts run typecheck

  public-history:
    name: 公开历史检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check_public_history.mjs --ref HEAD --working-tree
