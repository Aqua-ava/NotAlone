name: 代码检查

# 只做静态与登记门禁：不启动桌面 App、不打包、不连接数据库、不发送任何外部消息。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    name: 桌面类型与测试登记
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: node scripts/test-inventory.mjs

  backend:
    name: TypeScript 后端检查
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-ts
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npx --yes pnpm@11.25.0 install --frozen-lockfile
      - run: npx --yes pnpm@11.25.0 typecheck

  public-history:
    name: 公开历史检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node scripts/check_public_history.mjs --ref HEAD --working-tree
