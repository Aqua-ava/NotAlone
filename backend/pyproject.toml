[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "notalone"
version = "0.1.0"
description = "面向具体联系人的关系感知回复助手"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastembed==0.9.0",
    "deepagents==0.7.6",
    "httpx==0.28.1",
    "langchain==1.3.15",
    "langchain-core==1.5.5",
    "langchain-deepseek==1.1.0",
    "langgraph==1.2.11",
    "PyYAML>=6.0,<7",
    "psycopg[binary]>=3.3.4,<4",
]

[project.scripts]
notalone-memory-evaluate = "notalone.memory_extraction.evaluation:main"
notalone-ingest-preview = "notalone.ingest.preview:main"
notalone-ingest = "notalone.ingest.import_command:main"
notalone-extract-memory = "notalone.memory_extraction.command:extract_main"
notalone-memory-add = "notalone.memory_extraction.command:memory_add_main"
notalone-memory-list = "notalone.memory_extraction.command:memory_list_main"
notalone-memory-delete = "notalone.memory_extraction.command:memory_delete_main"
notalone-memory-trace = "notalone.memory_trace.command:memory_trace_main"
notalone-source-trace = "notalone.memory_trace.command:source_trace_main"
notalone-task-cleanup = "notalone.tasks.command:cleanup_main"
notalone-task-worker = "notalone.tasks.command:worker_main"
notalone-front-sync = "notalone.front_sync.command:front_sync_main"
notalone-server = "notalone.server.command:main"
notalone-retrieval-evaluate = "notalone.retrieval.evaluation:main"

[tool.setuptools.packages.find]
where = ["src"]
